name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies & Test
        run: |
          cd services/${{ matrix.service }}
          npm ci
          npm test

  build-and-scan:
    name: Build, Scan & Publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # Prepared for Cosign keyless OIDC signing (Phase 5)
    strategy:
      matrix:
        service: [api, frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define Image Reference
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="${{ env.REGISTRY }}/${OWNER_LC}/shop-${{ matrix.service }}"
          IMAGE_TAG="${{ github.sha }}"
          echo "image_ref=${IMAGE_NAME}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build container image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: ${{ steps.meta.outputs.image_ref }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.image_ref }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          trivyignores: .trivyignore

      - name: Push scanned image to GHCR (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ${{ steps.meta.outputs.image_ref }}

  update-config:
    name: Promote Image Tag to Config Repo
    needs: build-and-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform-config repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops-platform-config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update dev overlay image tag
        run: |
          cd apps/shop/overlays/dev
          kustomize edit set image shop-api=${{ env.REGISTRY }}/${{ github.repository_owner }}/shop-api:${{ github.sha }}
          kustomize edit set image shop-frontend=${{ env.REGISTRY }}/${{ github.repository_owner }}/shop-frontend:${{ github.sha }}

      - name: Commit and push configuration change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(dev): promote shop microservices to ${{ github.sha }}" || echo "No changes to commit"
          git push
