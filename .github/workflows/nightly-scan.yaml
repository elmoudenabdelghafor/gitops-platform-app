name: nightly-scan

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  nightly-trivy-scan:
    name: Nightly Image Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/shop-${{ matrix.service }}:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          trivyignores: .trivyignore
