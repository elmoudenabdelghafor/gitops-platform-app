version: 2
updates:
  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: docker
    directory: /services/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: /services/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: /services/frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
